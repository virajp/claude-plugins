# A fake .config/vwf.yaml of a multi-repo product — invented names only.
config_format: 28
blueprint_format: 26

blueprint:
  coverage: complete
  remaining: []

stacks: [ stackgen ]
addons: []

repo:
  stack:
    template: repo/example-repo

projects:
  api:
    repo: example-api # a member named in bootstrap's repo.members
    stack:
      template: project/example-service
      services: [
        example-postgres,
        example-auth,
      ]
      deploy: []
      frameworks: []
      dependencies: []
      note: picked for the example team's existing
        experience with it
    cicd: example-ci
    coverage_target: 90
  app:
    repo: "example-app"
    stack:
      template: unresolved
      services: unresolved
      deploy: [ example-store ]
    design: example-canvas
    stylesheet: example-tokens

enforcement:
  rules:
    topology/iac-own-repo/infra: {
      waived: true,
      reason: "kept beside the api: one deploy",
    }
  kept_files: {}

pipeline:
  coverage_target: 100
  review_round_cap: 4
  models: {}

after_landing: []
