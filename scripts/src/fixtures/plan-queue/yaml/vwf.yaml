# A fake .config/vwf.yaml of a multi-repo product — invented names only.
config_format: 27
blueprint_format: 25

blueprint:
  coverage: complete
  remaining: []

stacks: [ stackgen ]
addons: []

repo:
  stack:
    template: repo/example-repo
    package_manager: pnpm
    tools: []

projects:
  api:
    repo: example-api # a member named in bootstrap's repo.members
    stack:
      template: project/example-service
      backing_template: [
        example-postgres,
        example-auth,
      ]
      deploy_template: []
      languages: [ typescript ]
      frameworks: []
      dependencies: []
      note: picked for the example team's existing
        experience with it
    cicd: example-ci
    coverage_target: 90
  app:
    repo: "example-app"
    stack:
      template: unresolved
      backing_template: unresolved
      deploy_template: [ example-store ]
      languages: []
    design: example-canvas
    stylesheet: example-tokens

harness:
  dev: true
  local_stack: { present: true }
  health: false
  "test:load": false

enforcement:
  rules:
    topology/iac-own-repo/infra: {
      waived: true,
      reason: "kept beside the api: one deploy",
    }
  kept_files: {}

pipeline:
  coverage_target: 100
  review_round_cap: 4
  models: {}

after_landing: []
