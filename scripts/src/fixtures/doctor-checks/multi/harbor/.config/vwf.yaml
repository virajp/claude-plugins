# An invented multi-repo base, shaped on assets/vwf-config.md.
config_format: 28
blueprint_format: 26

stacks: [ stackgen ]

repo:
  stack:
    template: unresolved

projects:
  dock-app:
    repo: dock-app
    stack:
      template: project/kite-app
      services: []
      deploy: []
  dock-absent:
    repo: dock-absent
    stack:
      template: project/kite-app
      services: []
      deploy: []
