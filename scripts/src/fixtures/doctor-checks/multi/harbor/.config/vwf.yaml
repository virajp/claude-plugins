# An invented multi-repo base, shaped on assets/vwf-config.md.
config_format: 27
blueprint_format: 25

stacks: [ stackgen ]

repo:
  stack:
    template: unresolved

projects:
  dock-app:
    repo: dock-app
    stack:
      template: project/kite-app
      backing_template: []
      deploy_template: []
      languages: [ kite ]
  dock-absent:
    repo: dock-absent
    stack:
      template: project/kite-app
      backing_template: []
      deploy_template: []
      languages: [ kite ]
