# An invented single-repo product, shaped on assets/vwf-config.md.
config_format: 28
blueprint_format: 26

stacks: [ stackgen ]

repo:
  stack:
    template: repo/lumen-workspace

projects:
  orbit-api:
    stack:
      template: project/kite-service
      services: []
      deploy: []
      frameworks: []
      dependencies: []
    cicd: lumen-ci
  orbit-infra:
    stack:
      template: unresolved
      services: unresolved
      deploy: []

enforcement:
  rules: {}
