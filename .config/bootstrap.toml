# The bootstrap commit of the last sync. repo-sync writes it.
bootstrap_commit = "c92d55b9ca7c4eb376420ea82f956d007b67a352"
environments = [ "dev", "ci" ]
extensions = [ "astro-build.astro-vscode" ]
repo_name = "claude-plugins"
repo_url = "https://github.com/virajp/claude-plugins"

[tools.claude]

[tools.cloudflare]

[tools.github]

[tools.node]

[tools.pre-commit]
# The design exports, kept byte for byte.
exclude = [ "^docs/design/" ]

[branch.develop]
direct_commit = true

[overrides.gitignore]
add = [ ".dev-marketplace/" ]
