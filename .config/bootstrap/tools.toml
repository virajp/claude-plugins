# The tools of bootstrap for this repository, and their values. See docs/sync/index.md of bootstrap.
format = 3

[tools.claude]
[tools.cloudflare]
[tools.github]
[tools.node]
[tools.pre-commit]
# The design exports, kept byte for byte.
exclude = [ "^docs/design/" ]

[tools.dprint]
[tools.git]
[tools.linter]
[tools.mise]
[tools.gitleaks]
[tools.grype]
[tools.osv-scanner]
[tools.python]
[tools.pnpm]
# No code:format or code:lint gate examines these paths. brag-output/: the
# /brag output, kept byte for byte. plugins/**/*.md: dprint keeps their fold
# width, and the gate cannot skip only their fenced code blocks.
# docs/design/site/: the site design export, kept byte for byte.
[tools.mise.code_files]
excludes = [
  "**/*-lock.yaml",
  "**/*.svg",
  "**/package-lock.json",
  "brag-output/",
  "docs/design/site/",
  "plugins/**/*.md",
]
