# Synced from bootstrap: tools/python/tools.toml. Do not edit this file.
# The next sync replaces it, and a manual change is lost.

[env]
UV_NO_CACHE = true
UV_NO_MANAGED_PYTHON = true
UV_PYTHON_DOWNLOADS = "never"

[settings]
[settings.pipx]
uvx = true
[settings.python]
compile = false
uv_venv_auto = "create|source"

[tools]
[tools.python]
version = "3.14"
[tools.uv]
depends = [ "python" ]
version = "latest"
