min_version = "2026.9.13"

[settings]
activate_aggressive  = true
all_compile          = false
env_shell_expand     = true
gpg_verify           = true
pipx.uvx             = true            # every pipx: tool installs through uv
python.compile       = false           # only the python/uv dev tools in mise/conf.d/tools.dev.toml use it
python.uv_venv_auto  = "create|source"
raw                  = true
status.missing_tools = "always"

# Tools install in setup:mise from the lock, never before a task body.
task.run_auto_install = false

# NodeJS settings
node.compile        = false
npm.package_manager = "pnpm"

[tools]
"npm:cf" = { version = "latest" }
