[settings]
activate_aggressive  = true
all_compile          = false
env_shell_expand     = true
gpg_verify           = true
raw                  = true
status.missing_tools = "always"

# NodeJS settings
node.compile        = false
npm.package_manager = "pnpm"

# Generic config — applies to every environment (dev + ci). Environment-specific
# tools live in mise.dev.toml (MISE_ENV=dev, the maintainer's machine) and
# mise.ci.toml (MISE_ENV=ci, the GitHub workflows). Only the common runtime that
# both need (node, pnpm) lives here, to avoid duplicating it across both.
[tools]
node        = { version = "latest" }
osv-scanner = { version = "latest" }
pnpm        = { version = "latest" }

[env]
_.path = { path = "node_modules/.bin", tools = true }

# A MARKED POSITION. The orchestrator that shapes this repo replaces "unfilled"
# with the repo's project id: the name lowercased, every run of characters
# outside [a-z0-9] replaced by a single "-", leading and trailing "-" trimmed.
# So `virajp.dev` becomes `virajp-dev`. It is the same token the `p:<id>:*` task
# group, `setup:all`'s member flags and the `setup-<id>` aliases carry, and the
# rule and its reasons are stackgen's `assets/ids.md`.
#
# **It is a literal, and it is never derived at load time.** The obvious
# shorthand — reading the basename of the config root — is wrong in a linked
# worktree, whose directory is named after the BRANCH. A `REPO_NAME` that
# changes with the branch you are standing on is worse than none: everything
# reading it (a launcher, an editor profile) silently addresses a different repo.
#
# **Aliases that vary only by repo do not live here.** The Claude launchers are
# the case: `cc`, `cco`, `ccf` and their siblings are the same command in every
# repo with one token different, so they belong in the user's GLOBAL mise config
# reading `$REPO_NAME` — one definition, per-repo values. Shipping them here
# would copy the same alias into every repo and make a change to the launcher a
# change to every repo that has one.
REPO_NAME = "claude-plugins"

# A MARKED POSITION. How a branch reaches its destination — `code:merge:develop`
# and `code:merge:main` read it, and the branch model itself is the same under
# both values:
#
#   direct  merge locally and push the destination branch
#   pr      push the branch and open a pull request; nothing merges locally
#
# `direct` is the shipped default because it is what a repo with no reviewer
# needs, and because it is what these tasks did before the setting existed. A
# repo that gates landing on review sets `pr` and nothing else changes.
MERGE_MODEL = "direct"

# A MARKED POSITION. The repo's member projects, space separated, each path
# relative to this repo's root — `MEMBERS = "backend frontend"`. It is what
# `setup:all --all` recurses into and what `code:worktrees` walks.
#
# **Left EMPTY for a repo whose members are submodules**, which are read from
# `.gitmodules` instead: git already holds that list, and a second copy of it
# here would only let the two disagree. Empty is also the right value for a
# single-project repo, which has no members at all.
#
# One string rather than a list: TOML `[env]` values are strings, so the words
# are split by the task library rather than by the parser.
MEMBERS = ""

[tasks.init]
description = "Initialize mise tasks"
hide        = true
run         = "find .config/mise/tasks/ -name '*' -type f -exec chmod 755 {} \\;"
