# Routing returns the first room matching a path part, outermost first — claim every
# top-level directory and docs/ subtree deliberately, and keep keywords narrow.

wing: ai-plugins

exclude_patterns:
  # Secrets — the backstop behind .gitignore for a credential committed anyway.
  - .env*
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*credentials*"
  - "*secret*"

  - /.claude-plugin/

  - node_modules/
  - dist/
  - /bin/

rooms:
  - name: decisions
    description: Design and architecture decisions with their rationale, from
      docs/memory/decisions/
    keywords: [ decisions, rationale ]
  - name: problems
    description: Review and security findings and how they were resolved, from
      docs/memory/problems/
    keywords: [ problems, findings ]
  - name: planning
    description: Plan rationale and deferred options, from docs/memory/planning/
    # Not `plans` — that would capture docs/plans/, which is `repo-plans`.
    keywords: [ planning ]
  - name: gaps
    description: Blueprint and plan holes surfaced during execution, plus scope
      parked during elicitation
    keywords: [ gaps ]

  - name: plugins
    description: Authored plugin sources under plugins/ and their user docs
      under site/src/content/docs/plugins/
    keywords: [ plugins, plugin ]
  - name: installer
    description: The install-time half — the @virajp.dev/claude-plugins CLI in
      installer/
      and site/src/content/docs/installer/
    keywords: [ cli, installer ]
  - name: configuration
    description: Repo machinery under .config/ — mise envs, linter, formatter,
      and pre-commit config
    keywords: [ config, mise ]
  - name: cicd
    description: GitHub Actions workflows — plugin validation, npm release,
      the website deploy, and the monthly dep update
    keywords: [ github, workflows ]
  - name: repo-doctrine
    description: This repo's own Claude Code skills and agents under .claude/,
      plus CLAUDE.md
    keywords: [ claude ]
  - name: guides
    description: The task-shaped operator guides under
      site/src/content/docs/how-to/ - the greenfield and brownfield
      walkthroughs, and the operating loops
    keywords: [ how-to, guides ]
  - name: repo-plans
    description: Plan folders under docs/plans/, cycle and change plans alike,
      including the archived ones
    keywords: [ plans ]
  - name: general
    description: Files that don't fit other rooms
    keywords: []
