packages:
  - installer
  - scripts
  - site

# `allowBuilds`, not `onlyBuiltDependencies` — pnpm 11 silently ignores the old key.
allowBuilds:
  # tsup's engine — its postinstall links the platform binary, so the build cannot run without it.
  esbuild: true
  # Explicit denies: pnpm 11 fails a frozen install on an unlisted build script.
  sharp: false
  workerd: false

minimumReleaseAge: 600 # 10 hours

# Versions that must bypass the cooldown (e.g. a critical security hotfix):
# minimumReleaseAgeExclude:
#   - some-package@1.2.3

# Transitive fixes for advisories (osv-scanner gates release.yml); drop each once upstream ships it.
overrides:
  # GHSA-mh99-v99m-4gvg, GHSA-3jxr-9vmj-r5cp — via @oclif/core → minimatch@10.
  "brace-expansion@5": "5.0.8"

  # Same advisories via ejs → jake → minimatch@5, which breaks on 5.x; jake is ejs's CLI only.
  "ejs>jake": "-"

  # GHSA-g7r4-m6w7-qqqr — via tsup and vitest; first fixed version.
  # Not a newer release: minimumReleaseAge exists to keep one that fresh out.
  "esbuild": "0.28.1"

  # GHSA-ch52-4w7c-c8xp — via astro (site); first fixed version.
  "http-cache-semantics": "4.3.0"

  # GHSA-f23m-r3pf-42rh, GHSA-r5fr-rjxr-66jc — via mermaid → dagre-d3-es (site).
  "lodash-es": "4.18.1"
