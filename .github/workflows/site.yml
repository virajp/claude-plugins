name: Site

# Separate from release.yml on purpose — this publishes nothing to npm and holds no id-token.
on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [ main, develop ]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
    # `paths` does not apply to tag pushes; a tag always builds and deploys.
    tags:
      - "site-v*"
  workflow_dispatch: {}

permissions:
  contents: read

# Superseded branch and PR runs are cancelled; a tag's deploy never is.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  MISE_ENV: ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, build and link-check the site
        run: mise run p:site:check

      # `deploy` ships exactly the tree the gate checked, never a rebuild.
      - name: Upload the built site
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Strip the whole namespace — a bare `#v` removes nothing from `site-v…`.
      - name: Verify the tag matches site/package.json version
        run: |
          tag="${GITHUB_REF_NAME#site-v}"
          pkg="$(node -p "require('./site/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match site/package.json version $pkg"
            exit 1
          fi
          echo "Deploying site@$pkg"

      # pipeline/branch-validated: a release tag must be reachable from main.
      - name: Verify the tag is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main — refusing to deploy"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site/dist

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
