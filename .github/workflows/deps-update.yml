name: Monthly dependency update & release

# Publishing is DISPATCHED to release.yml, never workflow_call — see ci-and-releases.md.
on:
  schedule:
    - cron: "0 2 1 * *" # 02:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write # commit + push the refresh, version bump, and tag
  actions: write # dispatch release.yml on the new tag

concurrency:
  group: deps-update
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # develop, not main (merge-only); full history so the merge to main works.
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Update dependencies (respects the minimumReleaseAge cooldown)
        run: pnpm update

      - name: Check whether anything changed
        id: changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes this month — nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # No fix yet? Add an osv-scanner.toml ignore or a pnpm override.
      - name: Security-scan the updated dependencies (osv-scanner)
        if: steps.changed.outputs.changed == 'true'
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml

      - name: Cut a patch release (commit on develop, merge to main, tag)
        id: release
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pnpm-lock.yaml package.json
          mise x -- git commit -m "ops(deps): monthly dependency refresh"

          mise run p:i:version
          version="$(node -p "require('./package.json').version")"
          git add package.json
          mise x -- git commit -m "ops: bump installer to ${version}"
          git push origin develop

          # Merge, never force: a conflict fails the run, which is correct.
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-edit develop
          git push origin main

          # Tag only — this job owns the push and the dispatch.
          mise run p:i:release --ci
          # Must match the tag p:i:release created and release.yml's installer-v* filter.
          tag="installer-v${version}"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the tag via release.yml
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
