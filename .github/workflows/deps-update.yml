name: Monthly dependency update & release

# Publishing is DISPATCHED to release.yml, never workflow_call — see ci-and-releases.md.
on:
  schedule:
    - cron: "0 2 1 * *" # 02:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write # commit + push the refresh, version bump, and tag
  actions: write # dispatch release.yml on the new tag

concurrency:
  group: deps-update
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # develop, not main (merge-only); full history so the merge to main works.
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Update dependencies (respects the minimumReleaseAge cooldown)
        run: pnpm update

      - name: Check whether anything changed
        id: changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes this month — nothing to release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # No fix yet? Add an osv-scanner.toml ignore or a pnpm override.
      - name: Security-scan the updated dependencies (osv-scanner)
        if: steps.changed.outputs.changed == 'true'
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml

      - name: Cut a patch release (commit on develop, merge to main, tag)
        id: release
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The refresh is an installer patch: record it the way a landing plan does.
          source .config/mise/tasks/_scripts/helpers
          source .config/mise/tasks/_scripts/local
          releases_raise .config/releases.yaml installer PATCH

          git add pnpm-lock.yaml package.json .config/releases.yaml
          mise x -- git commit -m "ops(deps): monthly dependency refresh"

          # code:merge:main refuses untracked files, uncommitted changes and
          # unpushed commits on develop. Fail here, before anything is pushed,
          # naming what is dirty, rather than inside the release after it.
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::The tree is not clean after the refresh commit; nothing was pushed."
            printf '%s\n' "$dirty"
            exit 1
          fi
          git push -u origin develop
          if [ -n "$(git log --oneline origin/develop..develop)" ]; then
            echo "::error::develop has commits origin/develop does not."
            exit 1
          fi

          # code:merge:main needs a local main to check out.
          git fetch origin main
          git branch -f main origin/main

          # The same merge-only route a person takes: p:i:release bumps from the
          # recorded level, commits on develop, merges with code:merge:main and
          # tags on main. --ci stops at the tag — this job owns the push and the dispatch.
          mise run p:i:release -- --ci
          version="$(node -p "require('./package.json').version")"
          # Must match the tag p:i:release created and release.yml's installer-v* filter.
          tag="installer-v${version}"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the tag via release.yml
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
