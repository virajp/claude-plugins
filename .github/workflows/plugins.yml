name: Plugins

# Separate from release.yml on purpose — this publishes nothing and holds no id-token.
on:
  push:
    branches: [ main, develop ]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Freshness first, so a stale manifest fails as staleness.
      - name: Marketplace manifest matches the plugin manifests
        run: mise run p:plugins:marketplace --check

      - name: stackgen inventory matches the stacks tree
        run: mise run p:plugins:inventory --check

      - name: Static validation of plugins/
        run: mise run p:plugins:check

      # The `mise x` wrapper is redundant — tools.toml pins both.
      - name: shellcheck and shfmt over every shell file a pack ships
        run: |
          mise x shellcheck@latest shfmt@latest -- mise run p:plugins:shellcheck

      # main only: on develop a bumped ref has no tag yet, by design.
      - name: Every marketplace ref names a tag that exists
        if: github.ref == 'refs/heads/main'
        run: |
          missing=0
          while read -r ref; do
            if git ls-remote --exit-code --tags origin "refs/tags/$ref" >/dev/null 2>&1; then
              echo "  ok      $ref"
            else
              echo "::error::marketplace.json pins $ref, which is not a tag in this repo"
              missing=1
            fi
          done < <(node -p "require('./.claude-plugin/marketplace.json').plugins.map(p => p.source.ref).join('\n')")
          if [ "$missing" -ne 0 ]; then
            echo "::error::main names unreleased tags. Run 'mise run p:plugins:release' and push the tags."
            exit 1
          fi

      - name: Tooling and installer tests
        run: pnpm vitest run

      # GNU sed here is the point — the hook must work under BSD and GNU.
      - name: npm-normalize hook tests
        run: mise run p:plugins:npm-normalize-test

      - name: Type-check every package
        run: |
          pnpm exec tsc --noEmit -p installer
          pnpm exec tsc --noEmit -p scripts
