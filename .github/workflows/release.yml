name: Release

# npm's Trusted Publisher binds to this file's NAME — never rename it, never reach it by workflow_call.
on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch: {}

# id-token: write is required for OIDC trusted publishing.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Full history, or the reachable-from-main check fails for lack of commits.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up mise (node + pnpm, ci env)
        uses: jdx/mise-action@v4

      - name: Verify the tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          # Strip the whole namespace — a bare `#v` removes nothing from `installer-v…`.
          tag="${GITHUB_REF_NAME#installer-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing @virajp.dev/claude-plugins@$pkg"

      # pipeline/branch-validated: a release tag must be reachable from main.
      - name: Verify the tag is reachable from main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main — refusing to publish"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No fix yet? Add an osv-scanner.toml ignore or a pnpm override.
      - name: Security-scan the dependencies (osv-scanner)
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml

      - name: Run tests
        run: mise run p:i:test

      - name: Verify the publishable package
        run: mise run p:i:build

      # OIDC trusted publishing needs npm >= 11.5.1; the node-bundled npm may lag.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      # Idempotent: an already-published version is skipped, so re-runs are safe.
      - name: Publish to npm (OIDC trusted publishing + provenance)
        run: |
          ver="$(node -p "require('./package.json').version")"
          if npm view "@virajp.dev/claude-plugins@$ver" version >/dev/null 2>&1; then
            echo "@virajp.dev/claude-plugins@$ver is already published — skipping."
            exit 0
          fi
          npm publish --access public
