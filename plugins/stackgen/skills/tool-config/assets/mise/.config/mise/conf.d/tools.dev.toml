# Tools only the developer laptop needs (MISE_ENV=dev).

[tools]
# Development tools only — never the language runtime, which the package-manager
# component pins in tools.toml; python and uv below serve the uv-installed pipx
# tools, and their overlap with a runtime pack's python pin is accepted.
# These are what the shipped task library actually shells out to: code:format
# runs dprint, code:sec runs the scanners, setup:precommit runs pre-commit, and
# the shell gate reads every task file in this library. Because they live here,
# the aggregate gate needs the dev toolchain loaded —
# `MISE_ENV=dev mise run code:all`.
actionlint = { version = "latest" }
dprint     = { version = "latest" }
gitleaks   = { version = "latest" }
grype      = { version = "latest" }
jq         = { version = "latest" }
# The PyPI name really is graphifyy, double y.
"pipx:graphifyy" = { uvx = true, version = "latest" }
pre-commit       = { version = "latest" }
shellcheck       = { version = "latest" }
shfmt            = { version = "latest" }
taplo            = { version = "latest" }
# mise's pipx backend installs through uv, and uv needs a Python >= 3.10 to lock graphifyy's dependencies.
python = { version = "latest" }
uv     = { version = "latest" }

# No secret-manager tool here; the provider's pack asks for it through its tool-config: calls.
