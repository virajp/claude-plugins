name: mise
summary: The repo's toolchain manager — settings-only .config/mise*.toml
  files, one section file per table in .config/mise/conf.d/ scoped by MISE_ENV,
  one lock for every environment, and the file-based task library everything
  else invokes, grouped into `setup:*` for bootstrap, `code:*` for gates and
  git, and `p:<project-id>:*` for a project's own commands.
version: 1.7.0
type: toolchain-manager
kind: toolchain-manager
axis: repo
# All five topics of the toolchain-manager bar (assets/kinds.md): tool pinning
# & the config split, environment values, the task library contract, the
# mandatory task set, and bootstrap & CI parity.
#
# A toolchain manager satisfies no vwf harness capability — it is what the
# harness tasks are run BY. What it contributes is the repo-axis fact that the
# task names exist at all.
harness: n/a
# The editor fragment lands only where init's editor answer is vscode; every
# other file in config/ lands unconditionally. Paths are relative to config/.
conditional:
  - path: .config/vscode.d/mise.jsonc
    when:
      editor: vscode
