# The addons — optional Claude plugins a product may pick on the addon axis.
# stackgen-stack-menu lists each item; vwf's setup declares a picked one in
# the claude tool's plugins.project as "<plugin>@<marketplace>" = "<repo>"
# and runs setup:ai. name equals plugin.
addons:
  - name: taste-skill
    summary: The Claude plugin whose design skills the claude-code design
      tool's design-session authors through.
    plugin: taste-skill
    marketplace: taste-skill
    repo: Leonxlnx/taste-skill # owner/repo of the marketplace
    design_tools: [ claude-code ]
