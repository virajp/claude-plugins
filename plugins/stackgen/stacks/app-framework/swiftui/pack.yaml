name: SwiftUI
summary: The native Apple app stack — SwiftUI on Swift, the project a
  committed Xcode project, Xcode owning the build — one codebase across iPhone,
  iPad, Mac, CarPlay, Watch, TV and Vision.
version: 0.5.1
type: app-framework
category: native-ui
kind: app-framework
axis: project
# No platforms: list — the surfaces are the bundle's (swift-swiftui).
languages:
  - token: swift
    role: primary
    facts:
      lsp: >-
        sourcekit-lsp, shipped with Xcode's Swift toolchain; declared by this
        pack as `sourcekit-lsp` and provisioned via the generated local plugin
      mise_tool: >-
        n/a — Swift comes with Xcode, which mise does not install; the repo
        pins the Xcode it builds with as XCODE_VERSION, which this
        pack's mise template carries
      manifest: >-
        n/a — the dependency list lives in <Name>.xcodeproj/project.pbxproj,
        a path whose name is the app's, which this fact cannot fix
      # xcodebuild is probed, not looked up: /usr/bin/xcodebuild is a stub
      # every Mac carries, and with only the Command Line Tools selected it
      # exists on PATH and fails the moment it is run.
      binaries:
        - name: xcodebuild
          probe: "xcodebuild -version"
        - swift
lsp_servers:
  sourcekit-lsp:
    command: mise
    args: [ x, --, sourcekit-lsp ]
    extensionToLanguage:
      ".swift": swift
    startupTimeout: 1000
harness:
  goldens:
    task: test:golden
    mechanism: >-
      swift-snapshot-testing image snapshots of SwiftUI views, run through
      xcodebuild test on the pinned simulator — recorded under --record,
      compared otherwise
