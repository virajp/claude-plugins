name: SwiftUI
summary: The native Apple app stack — SwiftUI on Swift, the project declared
  in Tuist and generated, Xcode owning the build — one codebase across iPhone,
  iPad, Mac, CarPlay, Watch, TV and Vision.
version: 0.1.0
type: app-framework
category: native-ui
kind: app-framework
axis: project
# No platforms: list — the surfaces are the bundle's (swift-swiftui).
languages:
  - token: swift
    role: primary
    facts:
      lsp: >-
        sourcekit-lsp, shipped with Xcode's Swift toolchain; declared by this
        pack as `sourcekit-lsp` and provisioned via the generated local plugin
      mise_tool: >-
        n/a — Swift comes with Xcode, which mise does not install; Tuist, which
        drives it, is pinned through mise by this pack
      manifest: Project.swift
      binaries: [ xcodebuild, swift ]
lsp_servers:
  sourcekit-lsp:
    command: mise
    args: [ x, --, sourcekit-lsp ]
    extensionToLanguage:
      ".swift": swift
    startupTimeout: 1000
harness:
  goldens:
    task: test:golden
    mechanism: >-
      swift-snapshot-testing image snapshots of SwiftUI views, run through
      tuist test on a simulator — recorded under --record, compared otherwise
