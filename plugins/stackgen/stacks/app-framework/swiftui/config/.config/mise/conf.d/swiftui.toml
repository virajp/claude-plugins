# The SwiftUI pins, and nothing else: the Xcode this repo builds with and the
# one simulator its goldens are recorded and compared on. They sit in conf.d/
# so that mise.toml stays free of any app framework's name.
#
# These are the repo's COMMITTED pins, not per-machine overrides: every
# developer and CI build with the same Xcode and render goldens on the same
# simulator. Moving one is its own change — a new Xcode, or re-recorded
# goldens — landed together with what it changes.
#
# conf.d has NO environment scoping — the directory is read by glob, so this
# loads under every MISE_ENV. That is right for a pin: CI checks the same Xcode
# and renders on the same simulator a developer does.
#
# Each value below is shipped EMPTY. /vwf:setup, as it lands this pack, runs
# the detect command the pack declares for each, offers what this machine
# answers as the default, and writes the value confirmed. An empty value is
# refused by every task that reads it.

[env]
# A MARKED POSITION — XCODE_VERSION. The version `xcodebuild -version` prints on
# its first line (`27.0`, say). Every task that builds or resolves refuses any
# other selected Xcode.
XCODE_VERSION = ""

# A MARKED POSITION — SIMULATOR_PLATFORM. The destination platform the goldens
# are recorded on: `iOS Simulator`, or `macOS` for a Mac-only app.
SIMULATOR_PLATFORM = ""

# A MARKED POSITION — SIMULATOR_DEVICE. The simulator, by name, as
# `xcrun simctl list devices available` prints it (`iPhone 17`, say). Left
# empty on a `macOS` pin, which has no simulator.
SIMULATOR_DEVICE = ""

# A MARKED POSITION — SIMULATOR_OS. That simulator's OS version (`27.0`, say).
# Left empty on a `macOS` pin.
SIMULATOR_OS = ""
