name: HTML
summary: A hand-authored HTML5 page tree with plain CSS and ES-module
  JavaScript as the whole of a static site — no framework, no components, no
  content model; Vite serves it in development and builds it into `./dist`,
  with a copy-only build as the documented opt-out. It also carries the head
  doctrine every page states itself through — title, description, canonical,
  icons, sitemap and structured data, repeated per page since no layout owns
  them — and lands the one task that rasterizes the favicon set from the
  product's mark.
version: 0.1.0
type: framework
category: document
kind: language-bundle
axis: project
# Topic 2 of the language-bundle bar — one artifact per detected framework.
harness: n/a
# The lines this pack asks /stackgen:tool-config for.
tool-config:
  - dprint add plugin malva
  - dprint add plugin markup_fmt
