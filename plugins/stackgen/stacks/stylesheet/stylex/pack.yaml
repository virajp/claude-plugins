name: StyleX
summary: Styles authored as typed objects in the component's own language and
  compiled to atomic CSS at build — the token mapping type-checked, the
  cascade replaced by explicit merge order, and nothing evaluated at runtime.
version: 0.1.0
type: stylesheet
category: compile-time
kind: stylesheet
axis: stylesheet
# The bundle slug IS the projects.<name>.stylesheet token, so the pin and the
# config key are one value rather than two that can disagree.
# A stylesheet approach satisfies no harness capability: nothing here is booted,
# stood up or probed. The lint gate it can feed is a task stackgen:tool-config
# lands and owns.
harness: n/a
# The lines this pack asks /stackgen:tool-config for.
tool-config:
  - dprint add plugin malva
