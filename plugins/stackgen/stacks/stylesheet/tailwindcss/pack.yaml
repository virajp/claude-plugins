name: Tailwind CSS
summary: Utility classes generated from a token block — the design system's
  semantic roles declared once in CSS, and every style written at the call site
  as a class rather than in a stylesheet of its own.
version: 0.1.0
type: stylesheet
category: utility
kind: stylesheet
axis: stylesheet
# The bundle slug IS the projects.<name>.stylesheet token, so the pin and the
# config key are one value rather than two that can disagree.
# A stylesheet approach satisfies no harness capability: nothing here is booted,
# stood up or probed. The lint gate it can feed is a task the repo's gate
# bundle runs and owns.
harness: n/a
