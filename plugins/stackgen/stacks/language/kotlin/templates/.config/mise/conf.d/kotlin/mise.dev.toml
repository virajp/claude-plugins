# kotlin-lsp, JetBrains' Kotlin language server. It publishes no GitHub release
# asset, so the http backend reads the version from the release tag and
# downloads the archive from JetBrains. Dev only — CI never starts a language
# server — so the pin stays `latest`: `mise latest` cannot answer it before
# this file exists. Windows is not listed: its archive's launcher is unverified
[tools."http:kotlin-lsp"]
version = "latest"
version_list_url = "https://api.github.com/repos/Kotlin/kotlin-lsp/releases/latest"
version_regex = 'kotlin-lsp/v(\d+\.\d+\.\d+)'

[tools."http:kotlin-lsp".platforms]
macos-arm64 = { checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.sit.sha256", format = "zip", rename_exe = "kotlin-lsp", url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.sit" }
macos-x64 = { checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.sit.sha256", format = "zip", rename_exe = "kotlin-lsp", url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.sit" }
linux-arm64 = { checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.tar.gz.sha256", format = "tar.gz", rename_exe = "kotlin-lsp", url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.tar.gz" }
linux-x64 = { checksum_url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.tar.gz.sha256", format = "tar.gz", rename_exe = "kotlin-lsp", url = "https://download.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.tar.gz" }
