name: dprint
summary: The repo's single formatter — one config, plugins pinned, generated
  trees excluded. Ships .config/dprint.json and .config/taplo.toml.
version: 1.1.2
type: toolchain-gate
kind: repo-gate
axis: repo
# Topic 1 (format authority) of the repo-gate bar (assets/kinds.md).
# Gates satisfy no vwf harness capability.
harness: n/a
# The editor fragment lands only where init's editor answer is vscode; every
# other file in config/ lands unconditionally. Paths are relative to config/.
conditional:
  - path: .config/vscode.d/dprint-editor.jsonc
    when:
      editor: vscode
