name: swift-format
summary: The Swift formatter — swift-format, built into the toolchain as
  `swift format`, configured once under .config/.
version: 0.1.0
type: toolchain-gate
kind: language-bundle
axis: repo
# Topic 10 of the language-bundle bar, the format half. NOT a repo gate:
# this formatter is meaningful only for one toolchain, so it belongs to its
# language's bundle — and to the Swift app bundle, which reuses it unchanged.
harness: n/a
# The editor fragment lands only where init's editor answer is vscode; every
# other file in config/ lands unconditionally. Paths are relative to config/.
conditional:
  - path: .config/vscode.d/swift-format.jsonc
    when:
      editor: vscode
