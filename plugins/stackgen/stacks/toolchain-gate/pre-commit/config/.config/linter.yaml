---
# The lint gate's config file — read by `@askviraj/linter`, which the
# `code:lint` task of the pnpm, eslint, flutter, swift and swiftui packs runs,
# and the `lint` pre-commit hook runs through it.
#
# The linter is ZERO-CONFIG without this file: it ships an opinionated flat
# config covering every preset, and a repo that never opens this file gets the
# whole gate. This file exists so that when a default genuinely misfires there
# is one obvious place to say so, rather than an `eslint.config.*` grown by
# hand and a `--init` run nobody remembers to make.
#
# It ships EMPTY of overrides on purpose. Every commented block below is the
# shape of an override, not a rule this pack has an opinion about.
#
# Where each kind of change goes:
#   ignores   — paths the gate should not read at all
#   overrides — rules changed for one preset (preset names: javascript,
#               typescript, astro, json, jsonc, markdown, markdown-typescript,
#               yaml, toml, html, css)
#   configs   — a block scoped to a `files` glob, for a change that belongs to
#               a location rather than to a language
#
# Scope narrowly. A `files`-scoped override states WHERE a rule is wrong; a
# global one states that nobody wanted to look. Never disable a rule to make a
# real finding go away — that is the one use this file is not for.

version: 1

# The generated trees the stack packs produce. The linter does not read
# `.gitignore`, so without these a whole-tree `code:lint` walks build output.
# Its own defaults already skip `node_modules/`, `dist/`, `.turbo/`, `.astro/`,
# `coverage/` and `graphify-out/`; list only what they miss. A language pack
# that adds a generated tree adds it here, with the pack that produces it.
#
# Patterns resolve from the repo root, where a bare `build/` would match the
# root directory alone. Every entry is `**/`-prefixed instead, because a
# generated tree sits at its PROJECT root, and in a monorepo that is any depth;
# the syntax has no way to say "beside a pubspec.yaml". The cost is on the two
# generic names, `build/` and `Derived/`: a source directory so named, at any
# depth, goes unlinted. The other names are tool-specific and carry no such
# cost. A repo with such a source directory negates it below, e.g.
# `- "!src/build/"`.
ignores:
  - "**/build/" # app-framework/flutter
  - "**/.dart_tool/" # app-framework/flutter
  - "**/.build/" # package-manager/swiftpm
  - "**/.swiftpm/" # package-manager/swiftpm
  - "**/DerivedData/" # app-framework/swiftui
  - "**/Derived/" # app-framework/swiftui
  - "**/.venv/" # package-manager/uv
  # mise's sidecar lock tree; a --fix rewrite breaks the digest mise.lock pins
  - "**/.config/mise/locks/" # toolchain-manager/mise

# overrides:
