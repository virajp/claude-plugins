# Paths resolve relative to THIS file, so each climbs `../` to the repository root.

excluded:
  - ../.build
  - ../.swiftpm
  - ../**/Derived
  - ../**/DerivedData
  - ../**/*.generated.swift

# Layout rules off: swift-format decides layout.
disabled_rules:
  - trailing_comma # swift-format adds trailing commas to multi-line collections
  - opening_brace # swift-format puts a wrapped declaration's brace on its own line
  - line_length # wrapping is the formatter's, and it cannot break a literal

# Correctness and clarity rules off by default, each worth a failure.
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - sorted_first_last
  - fatal_error_message
  - discouraged_optional_boolean
  - unowned_variable_capture
  - private_swiftui_state
  - unused_parameter

identifier_name:
  excluded:
    - id
    - x
    - y
    - z
