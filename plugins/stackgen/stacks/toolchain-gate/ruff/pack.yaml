name: Ruff
summary: The lint and format gate for Python — one tool for both halves, run
  through the project's uv environment rather than a global install.
version: 0.3.0
type: toolchain-gate
kind: language-bundle
axis: repo
# Topic 10 of the language-bundle bar, the same placement `eslint` has and for
# the same reason. NOT a repo-gate: a linter meaningful for exactly one
# toolchain belongs to that toolchain's bundle.
#
# Authored ahead of its bundle: no `language/python` component and no python
# bundle exist yet, so nothing can compose this pack. See conventions.md.
harness: n/a
# The editor fragment lands only where init's editor answer is vscode; every
# other file in config/ lands unconditionally. Paths are relative to config/.
conditional:
  - path: .config/vscode.d/ruff.jsonc
    when:
      editor: vscode
