name: Cloudflare Workers AI
summary: Serverless inference on a catalog of open models, reached from a
  Worker through a binding — text, embeddings, vision, speech — the
  product's inference provider when the model it needs is in the catalog
  and the request should not leave the edge to be answered.
version: 0.1.0
type: cloud-service
category: inference
# `capability` is deliberately unset: `inference` realizes no vwf
# capability token today (../../../assets/taxonomy.md), and nothing here
# mints one — minting capabilities is vwf's move.
kind: cloud-provider
axis: backing
harness:
  health:
    task: n/a
    mechanism: >-
      An inference call is priced and non-deterministic, so the probe is
      not "ask a generation model something". Two honest ones: `wrangler
      ai models` proves the catalog answers and the token is valid but
      says nothing about the binding, and a fixed-input call to the
      smallest embedding model through the binding proves the binding
      resolves and the account is not rate-limited. Pick the second where
      the binding is what you doubt, and know that neither proves a
      generation model answers well
  e2e_staging:
    task: n/a
    mechanism: >-
      There is no per-environment resource to name — the binding carries
      no id, so every environment's binding is the same one and the
      models are production's. Isolation is therefore the product's job,
      not the service's, and the trap is cost: a suite that calls real
      inference on every run bills on every run and still cannot assert
      an exact output. The suite asserts against a seam the product owns
      and exercises real inference in a small, deliberately chosen set of
      cases
  local_stack:
    task: n/a
    mechanism: >-
      None — Workers AI has no local simulation, so the binding is opted
      into the live service with `remote: true` and every call from a
      laptop runs on the production models, bills, and counts against the
      same rate limits. There is no engine to compose behind a readiness
      gate, and this component adds nothing to the local task
