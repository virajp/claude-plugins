# Must sit at the repo root: fnox finds it by searching upward.
# Nothing here is a plaintext value — every entry names a provider and a lookup.

# A path that must not run half-configured overrides this per command.
if_missing = "warn"

[providers]
keychain = { prefix = "global/", service = "fnox", type = "keychain" }

[secrets]
# One entry per secret, declared even before its keychain entry exists.
#
# GLB_EXAMPLE = { provider = "keychain", value = "example", description = "what this credential is for" }
