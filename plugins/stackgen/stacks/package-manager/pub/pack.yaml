name: pub
summary: Dependency declaration and locking for a Flutter app — pubspec.yaml,
  which also carries the SDK constraints and native package-manager config.
version: 0.2.0
type: package-manager
package_manager: pub
kind: app-framework
axis: repo
harness: n/a
# The lines this pack asks /stackgen:tool-config for.
tool-config:
  - git add ignore template=Dart
  - git add ignore !pubspec.lock
