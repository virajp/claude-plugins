name: SwiftPM
summary: Dependency declaration, resolution and locking for a Swift package —
  Package.swift as the manifest, Package.resolved as the lockfile, .build/ as
  the one build tree.
version: 0.1.0
type: package-manager
package_manager: swiftpm
kind: language-bundle
axis: repo
# SwiftPM ships inside the Swift toolchain, so this pack lands no config and no
# task: the dependency tasks call `swift package`, and they are the language
# pack's, which owns the toolchain they run.
harness: n/a
