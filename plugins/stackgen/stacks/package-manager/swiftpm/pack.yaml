name: SwiftPM
summary: Dependency declaration, resolution and locking for a Swift package —
  Package.swift as the manifest, Package.resolved as the lockfile, .build/ as
  the one build tree.
version: 0.3.1
type: package-manager
package_manager: swiftpm
# The root one is a package's; the one inside an Xcode project is the app's,
# and Xcode writes it.
lockfile:
  - Package.resolved
  - "*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
kind: language-bundle
axis: repo
# SwiftPM ships inside the Swift toolchain, so this pack lands no config and no
# task: the dependency tasks call `swift package`, and they are the language
# pack's, which owns the toolchain they run.
harness: n/a
# The lines this pack asks /stackgen:tool-config for.
tool-config:
  - {
      tool: all,
      verb: add-exclude,
      paths: [ .build, .swiftpm ],
      generated: true,
    }
  - { tool: pre-commit, verb: add-linter-ignore, paths: [ .build, .swiftpm ] }
  - git add ignore template=Swift
  - git add attribute Package.resolved linguist-generated
