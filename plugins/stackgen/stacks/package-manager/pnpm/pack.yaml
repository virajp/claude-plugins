name: pnpm
summary: Dependency installation, locking and workspace layout for the Node
  ecosystem — the manifest contract and the monorepo shape.
version: 0.6.0
type: package-manager
package_manager: pnpm
kind: language-bundle
axis: repo
harness: n/a
# The lines this pack asks /stackgen:tool-config for.
tool-config:
  - mise add alias npx="pnpm dlx" to dev environment
  - mise add tool npm:sort-package-json 4.0.0 to dev environment
  - all add exclude generated node_modules .turbo
  - all add exclude *-lock.json *-lock.yaml
  - git add ignore template=Node
  - git add attribute pnpm-lock.yaml linguist-generated
