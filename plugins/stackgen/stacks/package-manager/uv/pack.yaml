name: uv
summary: Dependency resolution, locking, virtualenv management and process
  running for Python — one tool where the ecosystem historically had four.
version: 0.1.1
type: package-manager
package_manager: uv
kind: language-bundle
axis: repo
# Authored ahead of its bundle: no `language/python` component and no python
# bundle exist yet, so nothing can compose this pack. See conventions.md.
harness: n/a
# The lines this pack asks /stackgen:tool-config for.
tool-config:
  - all add exclude generated .venv
  - pre-commit add linter-ignore .venv
  - 'pre-commit add hook local uv-lock-check pre-commit name="uv lockfile is current" description="Fails when pyproject.toml moved and uv.lock did not, catching drift at the commit that caused it." entry="mise x -- uv lock --check" files="(^|.*/)pyproject\.toml$" language=system pass_filenames=false'
