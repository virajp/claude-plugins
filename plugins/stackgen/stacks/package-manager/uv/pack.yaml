name: uv
summary: Dependency resolution, locking, virtualenv management and process
  running for Python — one tool where the ecosystem historically had four.
version: 0.3.0
type: package-manager
package_manager: uv
kind: language-bundle
axis: repo
# Authored ahead of its bundle: no `language/python` component and no python
# bundle exist yet, so nothing can compose this pack. See conventions.md.
harness: n/a
# The lines this pack asks /stackgen:tool-config for.
tool-config:
  - { tool: all, verb: add-exclude, paths: [ .venv ], generated: true }
  - git add ignore template=Python
  - { tool: pre-commit, verb: add-linter-ignore, paths: [ .venv ] }
  - {
      tool: pre-commit,
      verb: add-hook,
      repo: local,
      id: uv-lock-check,
      stage: pre-commit,
      name: "uv lockfile is current",
      description: "Fails when pyproject.toml moved and uv.lock did not, catching drift at the commit that caused it.",
      entry: "mise x -- uv lock --check",
      files: '(^|.*/)pyproject\.toml$',
      language: system,
      pass-filenames: false,
    }
